<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>making stuff</title>
    
    <style type="text/css">
    
    img {width:90%}
    
    @media only screen and (min-width: 992px) {
      img {width:40%
      }
    }
    
    #container {
      display:grid;
      grid-template-columns: 30rem repeat(3, 1fr);
      grid-template-rows: 1fr 1fr;
      grid-gap: 1vw;
      margin: 1rem;
    }
    
    </style>
    <!-- The style.css file allows you to change the look of your web pages.
         If you include the next line in all your web pages, they will all share the same look.
         This makes it easier to make new pages for your site. -->
    <link href="/style.css" rel="stylesheet" type="text/css" media="all">
  </head>
  
  <body>
    <h1>let's make things</h1>
    <div id="container">
      <div class="content" align=center>
        <img src="images/content/creative/2023Birds2.jpg" />
      </div>
      <div class="content">
        <ul>
          <li>First thing</li>
          <li>Second thing</li>
          <li>Third thing</li>
        </ul>
      </div>
      
      
      <div class="content">
        three
      </div>
      <div class="content">
        four
      </div>
      <div class="content">
        five
      </div>
      <div class="content">
        six
      </div>
      <div class="content">
        seven
      </div>
      <div class="content">
        eight
      </div>
      
    <div>
    
  </body>
</html>
